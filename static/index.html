<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>地下蚁国</title>
<style>
  body{margin:0;background:#0d0b09;color:#cfc6bb;font:14px/1.5 monospace;display:flex;flex-direction:column;align-items:center}
  h1{font-size:16px;margin:10px 0 4px;color:#e8d5a3}
  canvas{image-rendering:pixelated;border:1px solid #333;display:block}
  #hud{margin:6px 0 4px;display:flex;gap:28px}
  .c0{color:#ffb020}.c1{color:#40c4ff}
  .hint{color:#666;font-size:12px;margin-bottom:14px}
</style>
</head>
<body>
<h1>地下蚁国 — 蚂蚁生态模拟器 <a href="/gallery" style="font-size:13px;color:#ffb020">· 蚁群图鉴 →</a></h1>
<canvas id="cv" width="2880" height="1800"></canvas>
<div id="hud"></div>
<div class="hint">单群落 · 觅食 · 掘隧道 · 育幼 · 扩建 · 维护 · 休息 · 绿圈=维护蚁（巡查/修复蚁穴）· zzz=睡觉蚁（累了回巢歇脚）</div>
<script src="ants.js"></script>
<script>
const W=240,H=150,S=12;
initAnts();
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const off=document.createElement("canvas");off.width=W;off.height=H;
const octx=off.getContext("2d"),img=octx.createImageData(W,H);
const hud=document.getElementById("hud");
let terrain=null,lastV=-1,frame=0;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

function drawGrid(fb){
  const d=img.data;
  for(let i=0;i<W*H;i++){
    const t=terrain[i],f=fb[i];
    let r,g,b;
    if(t===0){r=82;g=74;b=84}
    else if(t===1){const y=(i/W)|0;const k=1-(y/H)*0.35;r=95*k;g=72*k;b=48*k}
    else{r=24;g=18;b=13}
    if(f>0){const k=Math.min(1,f/120);r+=(150-r)*k;g+=(200-g)*k;b+=(60-b)*k}
    const o=i*4;d[o]=r;d[o+1]=g;d[o+2]=b;d[o+3]=255;
  }
  octx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(off,0,0,W*S,H*S);
}

function drawPantry(fc){
  // 阶段15b：每间粮室画成一堆"食物颗粒"（离散大圆点紧密堆积）——不是色块。
  // fc 项 = [房中心cx,cy, 半径rx,ry, 存粮amt]；越满颗粒堆得越满、越亮。
  for(const [cx,cy,rx,ry,amt] of fc){
    if(amt<2)continue;
    const px=(cx+0.5)*S, py=(cy+0.5)*S, ex=rx*S, ey=ry*S;
    const k=Math.min(1,amt/1000);       // 满仓度（粮室通常存 1000-2000）
    const gr=Math.max(4,S*0.5);         // 颗粒半径（≈半格，明显大于旧 1.5px 点）
    const step=gr*1.9;
    ctx.save();
    for(let gy=-ey;gy<=ey;gy+=step){
      for(let gx=-ex;gx<=ex;gx+=step){
        const q=(h=>h-Math.floor(h))(Math.sin(cx*12.9898+cy*78.233+(gx*0.71+gy*0.13))*43758.5453); // 确定性伪随机（逐帧稳定）
        const X=gx+(q-0.5)*step*0.55, Y=gy+((q*7%1)-0.5)*step*0.55;
        const rn=Math.sqrt((X*X)/(ex*ex)+(Y*Y)/(ey*ey));
        if(rn>1)continue;                 // 椭圆外不画
        if(rn>0.36+0.64*k)continue;       // 越空只在中心留一小堆
        const rr=gr*(0.85+0.3*(q*13%1));
        ctx.fillStyle=`rgb(${(224+26*q)|0},${(178+36*q)|0},${(58+22*q)|0})`;
        ctx.beginPath();ctx.arc(px+X,py+Y,rr,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle="rgba(96,64,18,0.6)";ctx.lineWidth=1;ctx.stroke();  // 深边=颗粒边界
      }
    }
    ctx.restore();
  }
}

function drawRestaurant(pr, pt){
  // 阶段16：蚂蚁饭店——暖色地板 + 圆餐桌（每桌一盘小食）+ 挂灯 + 招牌；
  // 有余粮时（pt>0）开派对：暖光脉动 + 三角彩旗 + 撒花 + 飘升音符。
  // 位置全由房中心/半径与索引派生（无随机、跨帧稳定），动画用 performance.now()。
  if(!pr||pr.length<4)return;
  const [cx,cy,rx,ry]=pr, ex=rx*S, ey=ry*S, t=performance.now()/1000;
  ctx.save();ctx.translate((cx+0.5)*S,(cy+0.5)*S);
  const fg=ctx.createRadialGradient(0,-ey*0.25,ey*0.15,0,0,ex); // 暖木地板
  fg.addColorStop(0,"#7c5731");fg.addColorStop(1,"#523a1f");
  ctx.beginPath();ctx.ellipse(0,0,ex*0.95,ey*0.95,0,0,Math.PI*2);ctx.fillStyle=fg;ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle="rgba(38,24,11,0.65)";ctx.stroke();
  const tn=Math.max(2,Math.min(4,Math.round(rx/3))); // 圆餐桌
  for(let i=0;i<tn;i++){
    const tx=(-0.55+1.1*(tn===1?0.5:i/(tn-1)))*ex*0.8, ty=Math.sin(i*1.9)*ey*0.22;
    const tr=Math.min(ex,ey)*0.24;
    ctx.fillStyle="#8a5a2b";ctx.beginPath();ctx.ellipse(tx,ty+tr*0.35,tr*0.55,tr*0.3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#a5713a";ctx.beginPath();ctx.ellipse(tx,ty,tr,tr*0.72,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#f2e6c0";ctx.beginPath();ctx.ellipse(tx,ty-tr*0.12,tr*0.42,tr*0.3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#e0a13c";ctx.beginPath();ctx.arc(tx,ty-tr*0.12,tr*0.15,0,Math.PI*2);ctx.fill();
  }
  ctx.strokeStyle="rgba(60,40,20,0.5)";ctx.lineWidth=1; // 挂灯串
  ctx.beginPath();ctx.moveTo(-ex*0.75,-ey*0.68);ctx.quadraticCurveTo(0,-ey*0.9,ex*0.75,-ey*0.68);ctx.stroke();
  const cols=["#ff6b6b","#ffd93d","#6bcB77","#4d96ff","#ff8ad8"];
  for(let i=0;i<=6;i++){
    const u=i/6;
    ctx.fillStyle=cols[i%cols.length];ctx.globalAlpha=pt>0?1:0.7;
    ctx.beginPath();ctx.arc(-ex*0.75+u*ex*1.5,-ey*0.68-0.22*ey*(4*u*(1-u))+3,2.6,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.fillStyle="rgba(255,236,180,0.9)";ctx.font="bold 12px monospace";ctx.textAlign="center";
  ctx.fillText("饭店",0,-ey-6);
  if(pt>0){
    const g=ctx.createRadialGradient(0,0,ey*0.1,0,0,ex*1.25); // 暖光脉动
    g.addColorStop(0,`rgba(255,214,120,${(0.3+0.18*Math.sin(t*6)).toFixed(3)})`);
    g.addColorStop(1,"rgba(255,214,120,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,ex*1.3,ey*1.3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#ff5a7a";ctx.globalAlpha=0.9;ctx.beginPath(); // 三角彩旗
    for(let i=0;i<=8;i++){
      const u=i/8, xb=-ex*0.85+u*ex*1.7, yb=-ey*0.5-0.3*ey*(4*u*(1-u));
      ctx.moveTo(xb-4,yb);ctx.lineTo(xb+4,yb);ctx.lineTo(xb,yb+7);ctx.closePath();
    }
    ctx.fill();ctx.globalAlpha=1;
    const cc=["#ff5a5a","#ffd23f","#5ce08a","#5aa9ff","#ff8ad8","#f2f2f2"]; // 撒花
    for(let i=0;i<30;i++){
      const q=(h=>h-Math.floor(h))(Math.sin(i*127.1+cx*7.3+cy*3.1)*43758.5453);
      const x0=(q-0.5)*ex*1.6, yy=((q*2)*ey*1.1+t*(26+q*70))%(ey*2.2)-ey*1.1;
      if((x0*x0)/(ex*ex)+(yy*yy)/(ey*ey)>1.05)continue;
      ctx.save();ctx.translate(x0,yy);ctx.rotate(t*4+q*7);
      ctx.fillStyle=cc[(q*97|0)%cc.length];ctx.fillRect(-2.2,-1.2,4.4,2.4);
      ctx.restore();
    }
    const notes=["♪","♫","♩"]; // 飘升音符
    ctx.fillStyle="rgba(255,244,190,0.95)";ctx.font="bold 13px monospace";ctx.textAlign="center";
    for(let i=0;i<3;i++){
      const ph=(t*0.8+i*0.37)%1;
      ctx.globalAlpha=1-ph;ctx.fillText(notes[i],(i-1)*ex*0.4,-ey*0.15-ph*ey*0.95);
    }
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawMounds(e){
  for(const xs of e){
    for(const x of xs){
      ctx.fillStyle="#5d4426";
      ctx.fillRect(x*S, S*1.4, S, S*0.6);
      ctx.fillStyle="#75582f";
      ctx.fillRect(x*S+2, S*0.8, S-4, S*0.7);
    }
  }
}

const angState=new Map(); // uid -> 当前朝向角（弧度），跨帧插值
function drawActors(a,l,q){
  for(let c=0;c<q.length;c+=3){drawQueen(ctx,(q[c]+0.5)*S,(q[c+1]+0.5)*S,c/3);
    if(q[c+2]){ // 蚁后睡觉：zzz 睡眠特效（睡时暂停产卵）
      const ph=performance.now()/600;
      ctx.save();ctx.translate((q[c]+0.5)*S,(q[c+1]+0.5)*S);ctx.textAlign="center";
      ctx.fillStyle="rgba(205,190,255,1)";
      for(let i=0;i<3;i++){ctx.globalAlpha=0.95-i*0.28;ctx.font=`bold ${8+i*5}px monospace`;ctx.fillText("z",8+i*7,-4-i*8+Math.sin(ph+i*0.9)*1.5);}
      ctx.restore();
    }
  }
  const seen=new Set();
  for(const [uid,x,y,c,st,caste,dir,maint,rest,sz,eat,pty] of a){
    seen.add(uid);
    const tgt=AANG[dir];
    let cur=angState.get(uid);
    if(cur===undefined)cur=tgt;
    let d=tgt-cur;
    while(d>Math.PI)d-=2*Math.PI;
    while(d<-Math.PI)d+=2*Math.PI;
    cur+=d*0.15; // 指数趋近放慢（约 0.4s）：方向逐 tick 微调时朝向平滑过渡、不逐帧追抖（用户"反复抽搐"）
    angState.set(uid,cur);
    const bob=pty?Math.sin(performance.now()/150+uid*0.7)*2.2:0; // 阶段16：派对蚁蹦跳
    drawAnt(ctx,(x+0.5)*S,(y+0.5)*S+bob,caste===1?"soldier":"worker",c,st===1,cur,sz);
    if(rest){ // 休息蚁：zzz 睡眠特效（干累了回蚁巢歇脚）
      const ph=performance.now()/550 + uid*0.7;
      ctx.save();
      ctx.translate((x+0.5)*S,(y+0.5)*S);
      ctx.textAlign="center";
      ctx.fillStyle="rgba(205,190,255,1)";
      for(let i=0;i<3;i++){
        ctx.globalAlpha=0.95 - i*0.28;
        ctx.font=`bold ${8+i*5}px monospace`;
        ctx.fillText("z", 8+i*7, -3 - i*8 + Math.sin(ph+i*0.9)*1.5);
      }
      ctx.restore();
    }
    if(eat){ // 吃饭蚁：粮室停留进食（琥珀色食物颗粒脉动特效，可见"在粮室吃")
      const ph=performance.now()/200 + uid*0.5;
      ctx.save();
      ctx.translate((x+0.5)*S,(y+0.5)*S);
      ctx.fillStyle="rgba(245,200,90,1)";
      for(let i=0;i<3;i++){
        const t=ph + i*2.1;
        ctx.globalAlpha=0.45+0.55*Math.sin(t);
        ctx.beginPath();
        ctx.arc(Math.sin(t*1.3)*5, -4 - i*3.2, 2.4, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
    if(maint){ // 维护蚁：绿色光环（定期巡查蚁穴、修复塌陷巢格）
      ctx.save();
      ctx.translate((x+0.5)*S,(y+0.5)*S);
      ctx.strokeStyle="rgba(110,220,120,0.85)";
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(0,0,13,0,Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }
    if(pty){ // 阶段16：派对蚁——头顶彩点（撒花/欢呼）
      const ph=performance.now()/220+uid*1.3;
      const pcols=["#ff5a5a","#ffd23f","#5ce08a","#5aa9ff","#ff8ad8"];
      ctx.save();
      ctx.translate((x+0.5)*S,(y+0.5)*S);
      for(let i=0;i<3;i++){
        const a2=ph+i*2.1;
        ctx.globalAlpha=0.5+0.5*Math.sin(a2);
        ctx.fillStyle=pcols[(uid+i)%pcols.length];
        ctx.beginPath();ctx.arc(Math.cos(a2)*(6+i), -9-i*2+Math.sin(a2)*2, 2, 0, Math.PI*2);ctx.fill();
      }
      ctx.globalAlpha=1;
      ctx.restore();
    }
  }
  if(angState.size>seen.size*2+200)
    for(const k of angState.keys())if(!seen.has(k))angState.delete(k); // 清理死亡蚂蚁
  for(const [x,y,st] of l){ // 阶段7.4：三阶段幼体分色渲染（卵=小白点 / 幼虫=米色方 / 蛹=浅褐椭圆）
    const cx=(x+0.5)*S, cy=(y+0.5)*S;
    if(st===0){ // 卵
      ctx.fillStyle="rgba(245,240,225,0.95)";
      ctx.beginPath();ctx.arc(cx,cy,2,0,Math.PI*2);ctx.fill();
    }else if(st===1){ // 幼虫
      ctx.fillStyle="#e8e0c8";
      ctx.fillRect(x*S+2,y*S+2,4,4);
    }else{ // 蛹
      ctx.fillStyle="rgba(210,190,150,0.95)";
      ctx.beginPath();ctx.ellipse(cx,cy,3,2.2,0,0,Math.PI*2);ctx.fill();
    }
  }
}

function drawDaylight(p){ // 昼夜渐变：p 0-1，0=白昼最亮、0.5=深夜最暗
  const dark=0.5*(1-Math.cos(2*Math.PI*p)); // 平滑：昼(0)→夜(1)→昼(0)
  if(dark>0.01){
    ctx.fillStyle="rgba(8,12,40,"+(dark*0.42).toFixed(3)+")";
    ctx.fillRect(0,0,W*S,H*S);
  }
}

function drawSleepRoom(sr){ // 阶段10：多睡室标记（虚线椭圆 + Zz），蚂蚁在此歇脚（不睡蚁后主厅）
  if(!sr)return;
  for(const [cx,cy,rx,ry] of sr){
    ctx.save();
    ctx.translate((cx+0.5)*S,(cy+0.5)*S);
    ctx.strokeStyle="rgba(150,140,220,0.4)";
    ctx.lineWidth=1.5;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.ellipse(0,0,rx*S,ry*S,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle="rgba(205,190,255,0.85)";
    ctx.font="bold 12px monospace";ctx.textAlign="center";
    ctx.fillText("Zz",0,-ry*S-4);
    ctx.restore();
  }
}

function drawHud(s){
  hud.innerHTML=`<span class="c0">蚁群 人口 ${s[0]} · 储粮 ${s[1]} · 幼体 ${s[2]} · 采食 ${s[3]}</span>`;
}

new EventSource("/stream").onmessage=(e)=>{
  const d=JSON.parse(e.data);
  if(d.v!==lastV){
    lastV=d.v;
    fetch("/terrain?v="+d.v).then(r=>r.json()).then(r=>{terrain=b64(r.t);});
  }
  frame++;
  const fb=b64(d.f);
  if(terrain)drawGrid(fb);
  drawMounds(d.e||[[],[]]);
  drawPantry(d.fc||[]);
  drawRestaurant(d.pr||[], d.pt||0);
  drawActors(d.a,d.l,d.q);
  drawSleepRoom(d.sr);
  drawDaylight(d.day||0);
  drawHud(d.s);
};
</script>
</body>
</html>
